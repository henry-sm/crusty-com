[package]
name = "gui-tauri"
version = "0.1.0"
edition = "2021"
authors = ["henry-sm"]

[lib]
name = "gui_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
# Add the new plugins and dependencies needed for integration
tauri-plugin-dialog = "2.0.0-beta"
tauri-plugin-shell = "2.0.0-beta"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
emu = { path = "../../emu" }
rand = "0.8" 