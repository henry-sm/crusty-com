<!doctype html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <link rel="stylesheet" href="styles.css" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Crusty SNES</title>
</head>
<body>
    <main class="container">
        <div class="layout">
            <!-- Left column: ROM display and status -->
            <div class="left-column">
                <div class="rom-section">
                    <canvas id="screen" width="256" height="224"></canvas>
                    <button id="loadRomBtn">Load ROM</button>
                </div>
                <div class="log-section">
                    <div class="section-header">STATUS & LOG</div>
                    <div id="statusLog" class="status-content">Ready to load ROM...</div>
                </div>
            </div>
            <!-- Right column: Opcodes -->
            <div class="right-column">
                <div class="opcodes-section">
                    <div class="section-header">OPCODES<br>BEING<br>EXECUTED</div>
                    <div id="opcodesDisplay" class="opcodes-content"></div>
                </div>
            </div>
        </div>
    </main>
    <script src="./main.js" type="module"></script>
</body>
</html>
